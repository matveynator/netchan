name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CGO_ENABLED: "0"

jobs:
  tests:
    name: tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
          cache: true
      - name: Test packages
        run: go test -count=1 ./...
      - name: Test embedded decoder budgets
        run: go test -count=1 -tags=netchan_small -run TestSmallDecoderRejectsAllocationBeforeReadingElements .
      - name: Test public TLS boundary
        env:
          NETCHAN_NETWORK_TEST: "1"
        run: >-
          go test -count=1 .
          -run '^TestPublic(ListenAndDial|ConfigAndListenerLifecycle|ClientsRemainIndependent|ListenerCloseTerminatesActiveChannel|ListenerCloseInterruptsIncompleteHandshake|TransportSchemes|NearbyDiscovery|NearbySecurityLifetime|EagerSecurityDoesNotBlockAccept)$'
      - name: Vet packages
        run: go vet ./...

  compatibility:
    # Repository rules require this historical status context. The supported
    # minimum is Go 1.26.9, enforced by go.mod and setup-go below.
    name: go1.19 compatibility
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up minimum Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
          cache: true
      - name: Test packages
        run: go test -count=1 ./...

  macos-native:
    name: macOS native BLE callbacks
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
          cache: true
      - name: Exercise native delegate ownership without radio access
        run: go test -count=1 -run TestAppleDelegateReuse ./pkg/transport/ble

  crosscompile:
    name: native transport matrix
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
          cache: true
      - run: go run ./scripts/crosscompile

  tinygo:
    name: TinyGo compatibility and board matrix
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
          cache: true
      - name: Install pinned TinyGo
        run: |
          curl -fsSL https://github.com/tinygo-org/tinygo/releases/download/v0.43.0/tinygo0.43.0.linux-amd64.tar.gz -o "${RUNNER_TEMP}/tinygo.tar.gz"
          echo "ca9fc6d055e3889462dea4450a2e42a92242d88b5c362a7ec39bdb563413d78a  ${RUNNER_TEMP}/tinygo.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/tinygo.tar.gz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/tinygo/bin" >> "${GITHUB_PATH}"
      - name: Static nested channels
        run: tinygo test -run TestStaticChannelBindings .
      - name: Interoperate with Go through verified TLS offload
        run: |
          tinygo build -tags=netchan_interop -o "${RUNNER_TEMP}/tinygo-interop" ./scripts/crosscompile/interop
          NETCHAN_TINYGO_TEST_BINARY="${RUNNER_TEMP}/tinygo-interop" go test -count=1 -run TestTinyGoWireInteroperability .
      - name: Compile SDK and processor capabilities independently
        run: go run ./scripts/crosscompile -tinygo tinygo

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Check reachable vulnerabilities
        run: govulncheck ./...

  gosec:
    name: gosec
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
          cache: true
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
      - name: Scan all rules
        id: scan
        continue-on-error: true
        run: gosec -fmt=sarif -out=gosec.sarif ./...
      - name: Upload gosec SARIF
        if: >-
          always() && hashFiles('gosec.sarif') != '' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: gosec.sarif
          category: gosec
      - name: Require clean gosec result
        if: steps.scan.outcome != 'success'
        run: exit 1

  codeql:
    name: CodeQL
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
          cache: true
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: go
          queries: security-extended
      - name: Build
        run: go build ./...
      - name: Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: /language:go
